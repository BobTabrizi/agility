# Every push to main and every pull request: lint, type-check, tests (the
# DynamoDB suite against DynamoDB Local — never real AWS), the production
# build, and the Docker image build. Nothing is deployed and no secrets are
# used.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run it makes outdated.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # DynamoDB Local, reachable at localhost:8000 — what `test:dynamo:local` expects.
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json
      - run: npm test
      - name: DynamoDB tests (DynamoDB Local)
        run: npm run test:dynamo:local
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      # Builds the image to prove it still builds; not pushed anywhere (yet).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
